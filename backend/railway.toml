# Bu manifest yalnızca Railway'de Root Directory=backend seçilirse kullanılmalıdır.
# Varsayılan tercih proje kökündeki ../railway.toml dosyasıdır.
[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.healthcheck]
path = "/api/health"
timeout = 30
