[build]
builder = "nixpacks"
buildCommand = "cp /app/backend/static/index.html /app/backend/static/index.html 2>/dev/null || true"

[deploy]
startCommand = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.healthcheck]
path = "/api/health"
timeout = 30
