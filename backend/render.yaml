# Hypertrophy-X v4.1 — Uyumlu ücretsiz Render Blueprint
# Tercih edilen manifest proje kökündeki ../render.yaml dosyasıdır.
# Neon PostgreSQL bağlantısını Render'da DATABASE_URL secret olarak girin.
services:
  - type: web
    name: hypertrophy-x
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && mkdir -p backend/static && cp frontend/index.html backend/static/index.html"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ENABLE_HSTS
        value: "false"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "10"
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: "900"
      - key: TRUST_PROXY_HEADERS
        value: "true"
